[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-a2a"
version = "0.0.0.dev0"
description = "Manage Git component dependencies with their responsible agents"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
git-a2a = "git_a2a:main"

[tool.setuptools]
py-modules = ["git_a2a"]
