name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to recover
        required: true
        type: string
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify release tag matches source version
        run: .github/scripts/check-version.sh "$RELEASE_TAG"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24.x'
          cache: true
      - name: Install HINT spec compiler
        run: npm install --global --ignore-scripts @openhint/cli@1.5.1 @openhint/hintbook-software-engineer@1.3.1
      - run: go build ./...
      - run: go test -count=1 ./...
  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24.x'
          cache: true
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Select configured publishers
        id: release_args
        run: |
          args='release --clean'
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then args="$args --skip=homebrew"; fi
          if [ -z "$SCOOP_BUCKET_TOKEN" ]; then args="$args --skip=scoop"; fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ steps.release_args.outputs.args }}
        env:
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
      - name: Verify the linked GHCR package is public
        run: |
          docker logout ghcr.io
          docker manifest inspect "ghcr.io/neprel/git-a2a:${RELEASE_TAG#v}" >/dev/null
  npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1
      - run: gh release download "$RELEASE_TAG" --dir release-artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 dist/npm/build_packages.py --artifacts release-artifacts --version "${RELEASE_TAG#v}" --out npm-packages
      - name: Publish platform packages and launcher
        run: |
          for package in npm-packages/darwin-* npm-packages/linux-* npm-packages/windows-*; do npm publish "$package" --access public; done
          npm publish npm-packages/git-a2a --access public
  pypi:
    needs: goreleaser
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/git-a2a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
      - run: gh release download "$RELEASE_TAG" --dir release-artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build PyPI wheels
        run: |
          version="${RELEASE_TAG#v}"
          pypi_version=$(printf '%s' "$version" | sed -E 's/-rc\.([0-9]+)$/rc\1/')
          python3 dist/pypi/build_wheels.py --artifacts release-artifacts --version "$pypi_version" --out wheelhouse
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: wheelhouse/
