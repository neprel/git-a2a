name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to recover
        required: true
        type: string
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify release tag matches source version
        run: .github/scripts/check-version.sh "$RELEASE_TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: true
      - name: Install HINT spec compiler
        run: npm install --global --ignore-scripts @openhint/cli@1.5.1 @openhint/hintbook-software-engineer@1.3.1
      - run: go build ./...
      - run: go test -count=1 ./...
  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: true
      - name: Select GoReleaser configuration
        id: release_config
        run: |
          config_file=.goreleaser.yaml
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            config_file="$RUNNER_TEMP/goreleaser-recovery.yaml"
            cp .goreleaser.yaml "$config_file"
            sed -i '/^release:$/a\  skip_upload: true' "$config_file"
          fi
          echo "path=$config_file" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name == 'push'
      - name: Log in to GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Select configured publishers
        id: release_args
        run: |
          args='release --clean'
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            args="$args --skip=homebrew --skip=scoop"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ steps.release_args.outputs.args }} --config ${{ steps.release_config.outputs.path }}
        env:
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign the immutable GHCR image digest with GitHub OIDC
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          image="ghcr.io/neprel/git-a2a:${RELEASE_TAG#v}"
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          cosign sign --yes "ghcr.io/neprel/git-a2a@$digest"
      - name: Verify the linked GHCR package is public
        run: |
          docker logout ghcr.io
          docker manifest inspect "ghcr.io/neprel/git-a2a:${RELEASE_TAG#v}" >/dev/null
  channels:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check channel credentials
        id: credentials
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          enabled=false
          if [ -n "$HOMEBREW_TAP_TOKEN" ] && [ -n "$SCOOP_BUCKET_TOKEN" ]; then enabled=true; fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
      - name: Render manifests from immutable release assets
        if: steps.credentials.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            *-*)
              echo "prerelease: leaving stable Homebrew and Scoop manifests unchanged"
              exit 0
              ;;
          esac
          release_dir="$RUNNER_TEMP/release-channel"
          brew_dir="$RUNNER_TEMP/homebrew-tap"
          scoop_dir="$RUNNER_TEMP/scoop-bucket"
          mkdir -p "$release_dir"
          gh release download "$RELEASE_TAG" --pattern checksums.txt --dir "$release_dir"
          GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh auth setup-git
          GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh repo clone neprel/homebrew-tap "$brew_dir"
          GH_TOKEN="$SCOOP_BUCKET_TOKEN" gh auth setup-git
          GH_TOKEN="$SCOOP_BUCKET_TOKEN" gh repo clone neprel/scoop-bucket "$scoop_dir"
          python3 tools/release-channels.py \
            --tag "$RELEASE_TAG" \
            --checksums "$release_dir/checksums.txt" \
            --homebrew "$brew_dir/Formula/git-a2a.rb" \
            --scoop "$scoop_dir/git-a2a.json"
          if git -C "$brew_dir" ls-files --error-unmatch Casks/git-a2a.rb >/dev/null 2>&1; then
            git -C "$brew_dir" rm Casks/git-a2a.rb
          fi
          git -C "$brew_dir" add Formula/git-a2a.rb
          git -C "$scoop_dir" add git-a2a.json
          for channel_dir in "$brew_dir" "$scoop_dir"; do
            git -C "$channel_dir" config user.name git-a2a-release
            git -C "$channel_dir" config user.email neprel@users.noreply.github.com
          done
          if ! git -C "$brew_dir" diff --cached --quiet; then
            git -C "$brew_dir" commit -m "Brew formula update for git-a2a $RELEASE_TAG"
            GH_TOKEN="$HOMEBREW_TAP_TOKEN" git -C "$brew_dir" push
          fi
          if ! git -C "$scoop_dir" diff --cached --quiet; then
            git -C "$scoop_dir" commit -m "Scoop update for git-a2a $RELEASE_TAG"
            GH_TOKEN="$SCOOP_BUCKET_TOKEN" git -C "$scoop_dir" push
          fi
  npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1
      - run: gh release download "$RELEASE_TAG" --dir release-artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 dist/npm/build_packages.py --artifacts release-artifacts --version "${RELEASE_TAG#v}" --out npm-packages
      - name: Publish platform packages and launcher
        run: |
          npm_tag=latest
          case "$RELEASE_TAG" in *-*) npm_tag=next ;; esac
          publish_if_missing() {
            package_dir="$1"
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            package_version="$(node -p "require('./${package_dir}/package.json').version")"
            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "${package_name}@${package_version} already exists; leaving it unchanged"
              return
            fi
            npm publish "./${package_dir}" --access public --tag "$npm_tag"
          }
          for package in npm-packages/darwin-* npm-packages/linux-* npm-packages/windows-*; do publish_if_missing "$package"; done
          publish_if_missing npm-packages/git-a2a
  mcp:
    needs: [goreleaser, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Download immutable MCP binary inputs
        run: gh release download "$RELEASE_TAG" --pattern 'git-a2a_npm_*' --dir release-artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build MCPB and registry metadata
        run: |
          version="${RELEASE_TAG#v}"
          python3 dist/npm/build_packages.py --artifacts release-artifacts --version "$version" --out npm-packages
          python3 dist/mcpb/build.py --packages npm-packages --version "$version" --out mcp-dist
      - name: Upload immutable MCP discovery assets
        run: |
          set -euo pipefail
          for asset in mcp-dist/*.mcpb mcp-dist/server.json; do
            name="${asset##*/}"
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              mkdir -p existing
              gh release download "$RELEASE_TAG" --pattern "$name" --dir existing
              cmp "$asset" "existing/$name"
              echo "$name already exists and is byte-identical"
            else
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned MCP Registry publisher
        run: |
          curl -fsSLo mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz' | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher validate mcp-dist/server.json
      - name: Publish stable metadata to the official MCP Registry
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish mcp-dist/server.json
  attest:
    needs: [goreleaser, mcp]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Download every immutable release asset
        run: gh release download "$RELEASE_TAG" --dir release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest every release asset, including MCPB discovery assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v4.2.2
        with:
          subject-path: release-assets/*
  pypi:
    needs: goreleaser
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/git-a2a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - run: gh release download "$RELEASE_TAG" --dir release-artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build PyPI wheels
        run: |
          version="${RELEASE_TAG#v}"
          pypi_version=$(printf '%s' "$version" | sed -E 's/-rc\.([0-9]+)$/rc\1/')
          python3 dist/pypi/build_wheels.py --artifacts release-artifacts --version "$pypi_version" --out wheelhouse
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: wheelhouse/
