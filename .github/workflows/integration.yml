name: Toolchain integration
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ecosystem: npm, image: 'node:22-bookworm', prepare: ':' }
          - { ecosystem: yarn, image: 'node:22-bookworm', prepare: 'corepack enable' }
          - { ecosystem: pnpm, image: 'node:22-bookworm', prepare: 'corepack enable' }
          - { ecosystem: bun, image: 'oven/bun:1.2', prepare: ':' }
          - { ecosystem: pypi, image: 'ghcr.io/astral-sh/uv:python3.13-bookworm', prepare: ':' }
          - { ecosystem: golang, image: 'golang:1.24-bookworm', prepare: ':' }
          - { ecosystem: cargo, image: 'rust:1.89-bookworm', prepare: ':' }
          - { ecosystem: swift, image: 'swift:6.2-jammy', prepare: ':' }
          - { ecosystem: pub, image: 'dart:stable', prepare: ':' }
          - { ecosystem: gem, image: 'ruby:3.4-bookworm', prepare: ':' }
          - { ecosystem: composer, image: 'composer:2', prepare: ':' }
          - { ecosystem: hex, image: 'hexpm/elixir:1.18.4-erlang-27.3.4-debian-bookworm-20250428', prepare: ':' }
          - { ecosystem: cabal, image: 'haskell:9.10', prepare: ':' }
          - { ecosystem: stack, image: 'haskell:9.10', prepare: ':' }
          - { ecosystem: zig, image: 'ghcr.io/ziglang/zig:0.14.1', prepare: ':' }
          - { ecosystem: clojure, image: 'clojure:temurin-21-tools-deps', prepare: ':' }
          - { ecosystem: nix, image: 'nixos/nix:2.28.3', prepare: ':' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24.x'
          cache: true
      - name: Build static adapter integration test
        run: CGO_ENABLED=0 go test -c -o build/adapter-it ./adapters
      - name: Run against the real toolchain
        run: |
          docker run --rm --entrypoint /bin/sh \
            -e GITA2A_IT=1 -e GITA2A_IT_ECOSYSTEM='${{ matrix.ecosystem }}' \
            -v "$PWD:/workspace" -w /workspace '${{ matrix.image }}' \
            -c '${{ matrix.prepare }} && ./build/adapter-it -test.run TestRealToolchainAdapterLifecycle -test.v'
