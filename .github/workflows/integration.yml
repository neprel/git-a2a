name: Toolchain integration
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ecosystem: npm, image: 'node:22-bookworm', prepare: ':' }
          - { ecosystem: yarn, image: 'node:22-bookworm', prepare: 'corepack enable' }
          - { ecosystem: pnpm, image: 'node:22-bookworm', prepare: 'corepack enable' }
          - { ecosystem: bun, image: 'oven/bun:1.2', prepare: 'apt-get update && apt-get install -y --no-install-recommends git ca-certificates' }
          - { ecosystem: pypi, image: 'ghcr.io/astral-sh/uv:python3.13-bookworm', prepare: ':' }
          - { ecosystem: golang, image: 'golang:1.24-bookworm', prepare: ':' }
          - { ecosystem: cargo, image: 'rust:1.89-bookworm', prepare: ':' }
          - { ecosystem: swift, image: 'swift:6.2-jammy', prepare: ':' }
          - { ecosystem: pub, image: 'dart:stable', prepare: ':' }
          - { ecosystem: gem, image: 'ruby:3.4-bookworm', prepare: ':' }
          - { ecosystem: composer, image: 'composer:2', prepare: 'apk add --no-cache git-daemon' }
          - { ecosystem: hex, image: 'hexpm/elixir:1.18.4-erlang-27.3.4-debian-bookworm-20250428', prepare: 'apt-get update && apt-get install -y --no-install-recommends git ca-certificates' }
          - { ecosystem: cabal, image: 'haskell:9.10', prepare: ':' }
          - { ecosystem: stack, image: 'haskell:9.10', prepare: ':' }
          - { ecosystem: zig, image: 'debian:bookworm-slim', prepare: 'apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl xz-utils && curl -fsSLo /tmp/zig.tar.xz https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz && echo "24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  /tmp/zig.tar.xz" | sha256sum -c - && tar -xJf /tmp/zig.tar.xz -C /opt && ln -s /opt/zig-x86_64-linux-0.14.1/zig /usr/local/bin/zig' }
          - { ecosystem: clojure, image: 'clojure:temurin-21-tools-deps', prepare: ':' }
          - { ecosystem: nix, image: 'nixos/nix:2.28.3', prepare: ':' }
          - { ecosystem: cmake, image: 'ubuntu:24.04', prepare: 'apt-get update && apt-get install -y --no-install-recommends cmake build-essential git ca-certificates' }
          - { ecosystem: gradle, image: 'gradle:8.14-jdk21', prepare: 'apt-get update && apt-get install -y --no-install-recommends git ca-certificates' }
          - { ecosystem: msbuild, image: 'mcr.microsoft.com/dotnet/sdk:8.0', prepare: 'apt-get update && apt-get install -y --no-install-recommends git ca-certificates' }
          - { ecosystem: maven, image: 'maven:3.9-eclipse-temurin-21', prepare: 'apt-get update && apt-get install -y --no-install-recommends git ca-certificates' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.x'
          cache: true
      - name: Build static adapter integration test
        run: CGO_ENABLED=0 go test -c -o build/adapter-it ./adapters
      - name: Run against the real toolchain
        run: |
          docker run --rm --entrypoint /bin/sh \
            -e GITA2A_IT=1 -e GITA2A_IT_ECOSYSTEM='${{ matrix.ecosystem }}' \
            -v "$PWD:/workspace" -w /workspace/adapters '${{ matrix.image }}' \
            -c '${{ matrix.prepare }} && ../build/adapter-it -test.run TestRealToolchainAdapterLifecycle -test.v'
