name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24.x'
          cache: true
      - name: Install HINT spec compiler
        run: npm install --global --ignore-scripts @openhint/cli@1.5.1 @openhint/hintbook-software-engineer@1.3.1
      - run: go build ./...
      - run: go test -count=1 ./...
      - run: python3 tools/gen-reference.py --check
