name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ''
          - os: windows-latest
            exe: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: runner.os == 'Linux'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install HINT compiler
        run: npm install --global --ignore-scripts @openhint/cli@2.0.1
      - name: Install Agent Skills reference validator
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - run: go build ./...
      - run: go test -count=1 ./...
      - name: Test native evidence reporting
        if: runner.os == 'Linux'
        run: make native-report-test
      - name: Prove public npm and uv lifecycle
        if: runner.os == 'Linux'
        run: go test ./internal/cli -run 'TestPublicCLI(NPM|UV)Lifecycle' -count=1 -v
      - name: Prove real Go adapter lifecycle
        if: runner.os == 'Linux'
        env:
          GITA2A_IT_GO: '1'
        run: go test ./adapters/golang -run TestRealGoToolPullMaterializesUsableModule -count=1 -v
      - name: Vet Go packages
        if: runner.os == 'Linux'
        run: go vet ./...
      - name: Run race tests
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: Run a2amodule conformance corpus
        env:
          CONFORMANCE_BIN: ${{ github.workspace }}/.conformance-bin${{ matrix.exe }}
        run: |
          go build -o .conformance-bin${{ matrix.exe }} ./cmd/git-a2a
          go run ./conformance/runner
      - run: make docs-check skills-check
  native-lifecycle:
    name: Native lifecycle / ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case:
          - submodule-git
          - npm
          - yarn-berry
          - pnpm
          - bun
          - uv
          - poetry
          - pdm
          - pep621
          - go-modules
          - cargo
          - swiftpm
          - pub
          - bundler
          - composer
          - mix-hex
          - cabal
          - stack
          - zig
          - clojure
          - nix-flake
          - cmake
          - gradle-kts
          - gradle-groovy
          - msbuild-csharp
          - msbuild-fsharp
          - maven
          - meson
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run pinned public-CLI lifecycle
        run: |
          native_status=0
          python3 tools/native-lifecycle/run.py \
            --case '${{ matrix.case }}' \
            --output 'build/native-ci/${{ matrix.case }}' || native_status=$?
          cat 'build/native-ci/${{ matrix.case }}/summary.md' >> "$GITHUB_STEP_SUMMARY"
          exit "$native_status"
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-lifecycle-${{ matrix.case }}
          path: build/native-ci/${{ matrix.case }}
          if-no-files-found: error
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build and run the flake package
        run: |
          nix build --print-build-logs
          nix flake check --print-build-logs
          nix run . -- --version
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: true
      - name: Cross-compile CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -o build/git-a2a-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/git-a2a
