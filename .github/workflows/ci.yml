name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ''
          - os: windows-latest
            exe: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.x'
          cache: true
      - name: Install HINT spec compiler
        run: npm install --global --ignore-scripts @openhint/cli@1.5.1 @openhint/hintbook-software-engineer@1.3.1
      - name: Install Agent Skills reference validator
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - run: go build ./...
      - run: go test -count=1 ./...
      - name: Run a2amodule conformance corpus
        env:
          CONFORMANCE_BIN: ${{ github.workspace }}/.conformance-bin${{ matrix.exe }}
        run: |
          go build -o .conformance-bin${{ matrix.exe }} ./cmd/git-a2a
          go run ./conformance/runner
      - run: python3 tools/gen-reference.py --check
      - run: make skills-check
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build and run the flake package
        run: |
          nix build --print-build-logs
          nix flake check --print-build-logs
          nix run . -- version
