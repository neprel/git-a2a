name: Installer checks
on:
  push:
    paths:
      - install.sh
      - sites/git-a2a.com/install.sh
      - sites/git-a2a.com/install.ps1
      - sites/git-a2a.com/.htaccess
      - .github/workflows/installers.yml
  pull_request:
    paths:
      - install.sh
      - sites/git-a2a.com/install.sh
      - sites/git-a2a.com/install.ps1
      - sites/git-a2a.com/.htaccess
      - .github/workflows/installers.yml
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      live_channels:
        description: Exercise published Homebrew/Scoop channels
        required: false
        default: false
        type: boolean
      live_site:
        description: Exercise the published PowerShell installer
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  posix:
    if: github.event_name != 'workflow_run'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            test-os: linux
            test-arch: x86_64
          - os: macos-latest
            test-os: darwin
            test-arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Parse and dry-run without network
        env:
          GIT_A2A_TEST_OS: ${{ matrix.test-os }}
          GIT_A2A_TEST_ARCH: ${{ matrix.test-arch }}
        run: |
          bash -n install.sh
          cmp install.sh sites/git-a2a.com/install.sh
          ./install.sh --version 1.0.0 --dir "$RUNNER_TEMP/git-a2a" --dry-run
      - name: Run shellcheck when available
        run: command -v shellcheck >/dev/null 2>&1 && shellcheck install.sh || true
  windows:
    if: github.event_name != 'workflow_run'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Parse with the PowerShell AST
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path sites/git-a2a.com/install.ps1), [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Dry-run without network
        shell: pwsh
        env:
          GIT_A2A_TEST_OS: windows
          GIT_A2A_TEST_ARCH: amd64
        run: '& sites/git-a2a.com/install.ps1 --version 1.0.0 --dir "$env:RUNNER_TEMP\git-a2a" --dry-run'
  scoop-live:
    if: github.event_name == 'workflow_dispatch' && inputs.live_channels
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install from the public Scoop bucket
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          scoop bucket add git-a2a https://github.com/neprel/scoop-bucket
          scoop install git-a2a/git-a2a
          $version = git-a2a --version
          $version
          $stableTag = gh release view --repo neprel/git-a2a --json tagName --jq .tagName
          $expected = ([string]$stableTag).Trim().TrimStart('v')
          $pattern = '^git-a2a ' + [regex]::Escape($expected) + ' .*windows/amd64, channel=scoop\)$'
          if ($version -notmatch $pattern) {
            throw "unexpected Scoop binary: $version"
          }
  site-live:
    if: github.event_name == 'workflow_dispatch' && inputs.live_site
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download and dry-run the public PowerShell installer
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri https://git-a2a.com/install.ps1
          $contentType = [string]$response.Headers['Content-Type']
          $contentType
          if ($contentType -notmatch '^text/plain(?:;|$)') {
            throw "unexpected install.ps1 Content-Type: $contentType"
          }
          $installer = [scriptblock]::Create((Invoke-RestMethod -Uri https://git-a2a.com/install.ps1))
          $expected = (Get-Content internal/version/VERSION -Raw).Trim()
          & $installer --version $expected --dir "$env:RUNNER_TEMP\git-a2a" --dry-run
  attestation-live:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify release provenance from the pinned release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          asset="git-a2a_${version}_linux_amd64.tar.gz"
          gh release download "$RELEASE_TAG" --repo neprel/git-a2a --pattern "$asset" --dir release-asset
          gh attestation verify "release-asset/$asset" \
            --repo neprel/git-a2a \
            --signer-workflow neprel/git-a2a/.github/workflows/release.yml
