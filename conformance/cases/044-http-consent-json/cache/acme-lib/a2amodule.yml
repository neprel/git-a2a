schema: 1
module: {id: acme-lib, repository: https://example.com/acme/lib}
agents:
  - name: acme-owner
    role: owner
    contacts:
      - kind: http
        intents: [change]
        url: "{{HTTP_URL}}/deliver?intent={intent}"
        method: POST
        content-type: application/json
        body: '{"module":"{module}","literal":"{{word}}","message":"{message}"}'
policy: {intents: {change: owner}}
